[project]
name = "investigacion-eventos"
version = "0.1.0"
description = "Asistente privado de investigación de eventos Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.64.0",
]

[project.scripts]
investigacion = "investigacion.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investigacion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
